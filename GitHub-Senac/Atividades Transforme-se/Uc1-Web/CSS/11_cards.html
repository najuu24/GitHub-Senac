<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./11_cards.css"/>
    <title>Cards</title>
</head>
<body>
    
    <h1>Cards</h1>

    <div class="deck">

        <div class="card">
            <img class="card-imagem" src="https://static.todamateria.com.br/upload/ur/so/ursopolarreproducao-cke.jpg"/>
            
            <div class="card-corpo">   
                <p class="capsula">Animais Árticos</p>
                <h2 class="card-titulo">Urso Polar</h2>
                <p class="card-descricao">Eles são muito brancos e muito fofinhos.</p>
                <button class="card-botao">Ver mais</button>
            </div>

        </div>


        <div class="card">
            <img class="card-imagem" src="https://nanpa.org/wp-content/uploads/sites/48/GROO_Dadand2kits.jpg"/>

                <p class="capsula">Animais Selvagens</p>
                <h2 class="card-titulo">Raposa</h2>
                <p class="card-descricao">Elas são muito espertas e têm rabos muito peludinhos.</p>
                <button class="card-botao">Ver mais</button>
            </div>

        </div>


        <div class="card">
            <img class="card-imagem" src="https://static.todamateria.com.br/upload/ur/so/ursopolarreproducao-cke.jpg"/>

                <p class="capsula">Animais Árticos</p>

                <p class="card-descricao">Eles são muito brancos e muito fofinhos.</p>
                <button class="card-botao">Ver mais</button>
            </div>

        </div>
